# Herdwatch: hosts to watch, one per line.
#
#   <label>   <ssh-target>
#
# label   letters, digits, ".", "_" or "-", at most 24 characters, unique.
#         The tab bar and the detail pane show it.
# target  any ssh destination: user@host, an alias from ~/.ssh/config,
#         or ssh://user@host:port. It must not start with "-".
#
# The host must accept a key login without a prompt (BatchMode).
# Remove the "#" in front of a line to watch that host.
#
# devbox    me@devbox
# buildbox  ssh://dev@10.0.0.7:2222
