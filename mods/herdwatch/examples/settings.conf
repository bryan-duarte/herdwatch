# Herdwatch: settings. One KEY=value per line, no quotes, no spaces around "=".
# A missing or invalid value keeps the default that is shown below.
#
# Percent at or above which a value shows "!" in the bar and yellow in the pane.
# WARN=70
# Percent at or above which a value shows "!!" in the bar, red in the pane, and counts for alerts.
# CRIT=90
# Processes per host in the detail pane. The host sends the top TOP_N by CPU and the top TOP_N by memory.
# TOP_N=30
# Seconds per host before a poll stops. Keep it below 5, the poll interval of the bar.
# SSH_TIMEOUT=3
# Seconds between detail pane redraws.
# PANE_REFRESH=2
# Herdr notifications for a sustained overload: on or off.
# ALERTS=on
# Polls in a row at or above CRIT before one notification.
# ALERT_POLLS=3
# Age in seconds after which values show as stale ("?").
# STALE_SECONDS=30
# Extended regex on the process name and path. Matching processes get a "●" marker.
# AGENT_PATTERN=claude|codex|opencode|aider|gemini|node|python
#
# Git worktree storage. Space-separated folders to search on each host ("~" is the home of the SSH user).
# A git linked worktree is found by its ".git" file or by its repository's ".git/worktrees" record,
# so worktrees from Claude Code, Codex, Cursor, Conductor, Herdr or plain git all count.
# WORKTREE_ROOTS=~
# Folder levels to search below each root.
# WORKTREE_DEPTH=7
# Seconds between two measures. "du" on big worktrees is slow, so keep this long.
# WORKTREE_INTERVAL=300
# Seconds before one measure of one host stops.
# WORKTREE_TIMEOUT=120
